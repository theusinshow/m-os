[package]
name = "mos-web"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

# A superficie de bolso do M/OS.
#
# Ela NAO e um segundo M/OS: e uma porta. Capturar, ver a inbox, mexer em tasks
# e falar com o Hermes — o trabalho de verdade continua no desktop, com o CAD
# aberto. Essa fronteira esta escrita aqui porque e ela que costuma escapar: o
# desktop expoe 280 comandos, e crescer ate la seria uma decisao, nao uma
# deriva.
#
# Ela e mais um DISPOSITIVO da malha: banco proprio, `mos-core` proprio, e
# sincroniza pelo mesmo hub que o desktop usa. Nao ha caminho de dados novo.
[dependencies]
mos-core = { path = "../../crates/mos-core" }
mos-storage-sqlite = { path = "../../crates/mos-storage-sqlite" }
mos-sync = { path = "../../crates/mos-sync" }
mos-sync-http = { path = "../../crates/mos-sync-http" }

axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
rusqlite = { version = "0.40", features = ["bundled-full"] }
# A PWA vai DENTRO do binario. Um servico que depende de uma pasta ao lado do
# executavel quebra quando alguem move o executavel — e o `systemd` roda com um
# `WorkingDirectory` que nem sempre e o que se imagina.
rust-embed = "8"
mime_guess = "2"

# ------------------------------------------------------------------ push
#
# Web Push sao duas RFCs — a 8292 (assinatura VAPID) e a 8291 (o payload
# cifrado) — e as duas cabem em `push.rs`, escritas a mao. O crate `web-push`
# foi medido e recusado por duas razoes concretas:
#
# 1. Ele depende de `http ^0.2` e `hyper 0.14`; o `axum` 0.8 daqui usa `http`
#    1.x. Seriam duas versoes de `http` na mesma arvore.
# 2. Ele puxa `ece`, cujo backend padrao e OpenSSL — que nesta maquina nao
#    existe, e que este `Cargo.toml` mantem preso a feature `passkey`
#    justamente para o resto continuar compilando aqui.
#
# O que torna a troca segura e que a RFC 8291 publica vetores de teste
# completos: chaves de entrada e o corpo cifrado esperado, byte a byte. A cifra
# e provada por `cargo test` no Windows, sem VPS e sem iPhone — e um push que
# nao chega nunca diz por que.
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
hkdf = "0.12"
aes-gcm = "0.11"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
# O mesmo cliente bloqueante do `mos-sync-http`, pela mesma razao: o envio
# acontece dentro de `spawn_blocking`, ao lado da rodada de sync.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
thiserror.workspace = true
time.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros", "time"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip"] }
uuid.workspace = true
getrandom = "0.3"
# 0.5 e a estavel; a 0.6 ainda e `-dev`. Um segredo nao entra em pre-release.
#
# OPCIONAL, e a razao e concreta: ele depende de OpenSSL, que nao existe na
# maquina de desenvolvimento. Como dependencia obrigatoria, ele impediria de
# compilar TODO o resto do `mos-web` — o servidor, o sync, a superficie — por
# causa da porta. Com feature, o resto anda aqui e a porta e conferida onde
# OpenSSL existe: no CI e na VPS, que e onde ela vai rodar.
webauthn-rs = { version = "0.5", features = [
    "danger-allow-state-serialisation",
], optional = true }
# O OpenSSL que o `webauthn-rs` exige, compilado JUNTO em vez de pego do
# sistema.
#
# Duas razoes, e as duas sao de build e nao de gosto: cruzando para `musl`, o
# OpenSSL do Ubuntu e glibc e nao serve; e na VPS isto remove a dependencia da
# versao que a distro tiver. Ele fica preso a feature `passkey` — sem ela, nada
# de OpenSSL entra, e e por isso que o Windows continua compilando.
openssl = { version = "0.10", features = ["vendored"], optional = true }

[features]
default = []
# A porta de verdade. Ligada no CI e na VPS.
passkey = ["dep:webauthn-rs", "dep:openssl"]
# A porta ABERTA, para desenvolvimento.
#
# Ela nao entra em `default` e o binario RECUSA a subir com ela ligada se o bind
# nao for localhost — uma porta de desenvolvimento que chega em producao e como
# a maioria dos vazamentos comeca.
porta-aberta = []

[dev-dependencies]
axum = "0.8"
# O teste de notificacao faz o papel do APARELHO: ele gera o proprio par de
# chaves, assina, e DECIFRA o que o servidor mandou. Sem decifrar, o teste
# provaria apenas que um POST saiu — e um POST que sai com o conteudo errado e
# exatamente o defeito que so o iPhone perceberia.
p256 = { version = "0.13", features = ["ecdh"] }
hkdf = "0.12"
aes-gcm = "0.11"
base64 = "0.22"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
mos-sync-server = { path = "../../crates/mos-sync-server" }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies"] }
tempfile = "3"
