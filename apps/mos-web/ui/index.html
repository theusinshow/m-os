<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!-- `viewport-fit=cover` e o par obrigatorio do `env(safe-area-inset-*)`
         do CSS: sem ele o iPhone nao entrega os insets, e a barra inferior
         come o botao de capturar. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A0C0E" />
    <!-- A cor da barra de status quando instalado na tela de inicio. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="M/OS" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icone.svg" type="image/svg+xml" />
    <!-- PNG, e nao SVG: o iOS ignora SVG aqui, e sem um PNG o icone da tela de
         inicio vira um print da propria pagina. 180x180 e o tamanho que ele
         pede. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icone-180.png" />
    <title>M/OS</title>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
