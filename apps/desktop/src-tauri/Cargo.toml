[package]
name = "mos-desktop"
version.workspace = true
description = "M/OS desktop application"
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mos_desktop_lib"
# Somente rlib. O template do Tauri v2 traz staticlib e cdylib para iOS e Android;
# no desktop nada os consome — o binario linka o rlib. Construir a cdylib estourava
# o limite de ordinais de exportacao do ld do mingw ("export ordinal too large"),
# quebrando tauri dev e cargo test --workspace no ambiente portable com w64devkit.
# Se um dia houver alvo mobile, os dois voltam aqui.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mos-core = { path = "../../../crates/mos-core" }
mos-hermes = { path = "../../../crates/mos-hermes" }
mos-storage-sqlite = { path = "../../../crates/mos-storage-sqlite" }
tokio = { version = "1", features = ["rt", "sync", "macros"] }
serde.workspace = true
serde_json = "1"
# Declarado porque o `mos-core` expoe `OffsetDateTime` na API publica: quem
# monta um `Period` ou soma uma duracao precisa do mesmo tipo, e depender dele
# por acaso via arvore de dependencias e o que quebra no dia em que o core
# mudar de versao.
time.workspace = true
# A fatura em PDF. Fontes internas do PDF, sem arquivo externo: um PDF que
# depende de fonte instalada e um PDF que abre errado na maquina do cliente.
printpdf = "0.7"
# Lista de processos em execucao. Le APENAS nomes de executavel — nunca titulo
# de janela, conteudo de arquivo ou linha de comando. A fronteira e a diferenca
# entre observar e vigiar, e ela e mantida pela escolha da API.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tauri-plugin-notification = "2"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.10.1"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }
# Cliente HTTP e credencial para a Action API do M-Finance. Mesmas versoes e
# features de crates/mos-hermes/Cargo.toml, sem "cookies" (nao ha sessao aqui,
# cada chamada manda o secret no header).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native"] }
