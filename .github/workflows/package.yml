name: Package Windows

# Tres jeitos de chegar aqui (ADR-091):
#
# - push no master que mexe no desktop -> o CI passa -> versao nova publicada,
#   numerada sozinha a partir da ultima tag. E isso que o M/OS instalado
#   encontra ao abrir, e ele nao deixa trabalhar na versao velha;
# - tag `v*` empurrada a mao -> publica exatamente aquela versao (salto de
#   minor/major continua sendo uma decisao, e nao um contador);
# - workflow_dispatch -> so o pacote, como artifact, sem publicar.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: write

# Um release por vez. Dois pushes seguidos: o segundo espera o primeiro, e o
# contador nunca publica o mesmo numero duas vezes.
concurrency:
  group: package-windows
  cancel-in-progress: false

jobs:
  decide:
    name: Decide the version
    runs-on: ubuntu-latest
    # Release so de master verde: um build que nao passou nos testes nao pode
    # virar a versao que todo mundo e obrigado a instalar.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      build: ${{ steps.decide.outputs.build }}
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          base=$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml | head -1)

          if [ "$EVENT" = "push" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=${REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "version=$base" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          # O que entra no instalador: o desktop, o nucleo, o design system.
          changed=$(git diff --name-only "$latest" "$SHA" -- apps/desktop crates packages Cargo.toml Cargo.lock | head -50)
          if [ -z "$changed" ]; then
            echo "Nada do desktop mudou desde $latest. Sem release."
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last=${latest#v}
          IFS=. read -r major minor patch <<< "$last"
          bumped="$major.$minor.$((patch + 1))"
          # A versao do repositorio so manda quando alguem a subiu a mao (0.8.0).
          if [ "$(printf '%s\n%s\n' "$base" "$bumped" | sort -V | tail -1)" = "$base" ] && [ "$base" != "$last" ]; then
            next=$base
          else
            next=$bumped
          fi
          echo "Desde $latest mudou:"; echo "$changed"
          echo "Versao nova: $next"
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"

  package:
    name: Windows package
    needs: decide
    if: needs.decide.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.decide.outputs.version }}
      TAG: v${{ needs.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.decide.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Stamp the release version
        if: github.event_name == 'workflow_run'
        shell: pwsh
        run: ./scripts/set-version.ps1 $env:VERSION

      - name: Check version consistency
        shell: pwsh
        run: ./scripts/check-version.ps1

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build no-admin Windows package
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --ci --bundles nsis

      - name: Prepare updater metadata
        if: needs.decide.outputs.publish == 'true'
        shell: pwsh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ env.TAG }}
        run: |
          $bundleDir = "target/release/bundle/nsis"
          $setup = Get-ChildItem -LiteralPath $bundleDir -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $setup) {
            throw "NSIS setup executable not found."
          }

          $signature = Get-ChildItem -LiteralPath $bundleDir -Filter "$($setup.Name).sig" | Select-Object -First 1
          if (-not $signature) {
            throw "Updater signature not found for $($setup.Name)."
          }

          $version = $env:GITHUB_REF_NAME.TrimStart("v")

          $releaseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$($setup.Name)"
          $latest = [ordered]@{
            version = $version
            notes = "M/OS $env:GITHUB_REF_NAME"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content -Raw -LiteralPath $signature.FullName).Trim()
                url = $releaseUrl
              }
            }
          }

          $latest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $bundleDir "latest.json") -Encoding UTF8

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: m-os-windows-${{ env.TAG }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sig
            target/release/bundle/nsis/latest.json
            target/release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: needs.decide.outputs.publish == 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ env.TAG }}
          TARGET_SHA: ${{ needs.decide.outputs.sha }}
        run: |
          $bundleDir = "target/release/bundle/nsis"
          $files = @(
            (Get-ChildItem -LiteralPath $bundleDir -Filter "*-setup.exe" | Select-Object -First 1).FullName,
            (Get-ChildItem -LiteralPath $bundleDir -Filter "*-setup.exe.sig" | Select-Object -First 1).FullName,
            (Join-Path $bundleDir "latest.json"),
            (Get-ChildItem -LiteralPath "target/release" -Filter "mos-desktop.exe" | Select-Object -First 1).FullName
          )

          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            $arguments = @("release", "upload", $env:GITHUB_REF_NAME, "--repo", $env:GITHUB_REPOSITORY, "--clobber") + $files
            & gh @arguments
          } else {
            $arguments = @("release", "create", $env:GITHUB_REF_NAME, "--repo", $env:GITHUB_REPOSITORY, "--target", $env:TARGET_SHA, "--title", "M/OS $env:GITHUB_REF_NAME", "--generate-notes", "--latest") + $files
            & gh @arguments
          }
