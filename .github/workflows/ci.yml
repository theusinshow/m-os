name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Windows desktop
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check version consistency
        shell: pwsh
        run: ./scripts/check-version.ps1

      # Só no CI, e nunca no `package.yml`: contraste ruim precisa barrar um PR,
      # mas não pode ser motivo para um release não sair.
      - name: Check token contrast
        run: python scripts/check-contrast.py

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      # A PWA do `mos-web` ANTES de qualquer passo de Rust, e nao por capricho
      # de ordem: o crate embute `apps/mos-web/static/` com `rust-embed`, que le
      # a pasta em tempo de COMPILACAO. Sem ela, `cargo clippy --workspace` e
      # `cargo test --workspace` nem chegam a rodar — quebram em
      # "folder does not exist", e o job morre antes de conferir qualquer coisa.
      #
      # Isso ficou escondido por meses atras do `cargo fmt --all --check`, que
      # falhava antes e derrubava o job primeiro. Destravada a formatacao, este
      # apareceu na hora.
      - name: Build the pocket PWA
        working-directory: apps/mos-web/ui
        run: |
          npm ci
          npm run build

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Build renderer
        working-directory: apps/desktop
        run: npm run build

      - name: Build Tauri app
        working-directory: apps/desktop
        run: npm run tauri -- build --debug --no-bundle --ci
