# O binario do hub, para Linux.
#
# Por que no CI e nao na VPS: compilar la exigiria Rust instalado num servidor
# que so precisa EXECUTAR o hub, e uma toolchain a mais e uma superficie a mais
# num lugar exposto. Aqui sai um executavel unico, sem dependencia de runtime —
# o `rusqlite` entra com `bundled-full`, entao nem SQLite o servidor precisa ter.
#
# `musl` e nao `gnu`: o binario `gnu` amarra o `glibc` da imagem do runner, e uma
# VPS com glibc mais antigo recusa a executa-lo com um erro que nao explica nada.
# O estatico roda em qualquer Linux x86_64.

name: Sync server

# Sem gatilho por tag: o binario do hub nao acompanha a versao do app. Quem o
# quer, pede — e o `paths` garante que ele seja reconstruido quando o codigo
# dele muda, sem gastar runner nas outras mudancas do monorepo.
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "crates/mos-sync-server/**"
      - "crates/mos-sync/**"
      - ".github/workflows/sync-server.yml"

permissions:
  contents: write

jobs:
  build:
    name: Linux x86_64 (musl)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      # O `bundled-full` do rusqlite compila o SQLite junto, e para o alvo musl
      # isso precisa do compilador C correspondente.
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Test
        run: cargo test -p mos-sync-server --locked

      - name: Build
        run: cargo build -p mos-sync-server --release --locked --target x86_64-unknown-linux-musl

      # Prova que o binario e mesmo estatico. Sem isto, uma mudanca de
      # dependencia poderia reintroduzir o vinculo dinamico em silencio, e o
      # defeito so apareceria na VPS.
      # A pergunta certa e "ele depende de alguma biblioteca?", e nao "o ldd
      # disse a frase que eu esperava". A primeira versao procurava
      # "not a dynamic executable" e reprovava um binario perfeitamente
      # estatico, porque o ldd moderno responde "statically linked" para um
      # `static-pie`. Uma linha com `=>` e uma dependencia de verdade; e isso, e
      # so isso, que impede o binario de rodar numa VPS qualquer.
      - name: Verify it is static
        run: |
          arquivo="target/x86_64-unknown-linux-musl/release/mos-sync-server"
          file "$arquivo"
          if ldd "$arquivo" 2>&1 | grep -q '=>'; then
            echo "O binario depende de bibliotecas do sistema:"
            ldd "$arquivo"
            exit 1
          fi
          echo "Sem dependencias dinamicas."

      - uses: actions/upload-artifact@v4
        with:
          name: mos-sync-server-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/mos-sync-server
          if-no-files-found: error
