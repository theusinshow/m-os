[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "apps/mos-web",
    "crates/mos-audio",
    "crates/mos-core",
    "crates/mos-hermes",
    "crates/mos-ingest",
    "crates/mos-storage-sqlite",
    "crates/mos-sync",
    "crates/mos-sync-http",
    "crates/mos-sync-server",
    "crates/mos-transcribe",
    "crates/mos-usage",
]

# O CronoCAD entrou no monorepo com o proprio `src-tauri`, e um pacote Rust
# dentro de um workspace sem estar declarado nele para de compilar: cargo sobe a
# arvore, encontra este manifesto e recusa com "believes it's in a workspace
# when it's not".
#
# Fica em `exclude`, e nao em `members`, porque ele ainda e uma aplicacao
# separada com o proprio conjunto de dependencias — outros plugins do Tauri,
# outras versoes. Vira-lo membro agora forcaria resolucao compartilhada e
# quebraria um dos dois lados por um ganho que so existe depois da absorcao
# (ADR-032, fase 3).
exclude = ["apps/cronocad/src-tauri"]

[workspace.package]
version = "0.3.6"
edition = "2021"
authors = ["Coded by M"]
license = "UNLICENSED"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
# `v5` alem do `v7`: relacao do Knowledge Graph tem id DERIVADO do par, e nao
# sorteado. Dois dispositivos que ligam o mesmo Resource ao mesmo Project
# precisam chegar ao mesmo id sem se falarem — v5 e determinístico por nome, e e
# exatamente isso. Ver `mos-sync::relacao`.
uuid = { version = "1", features = ["serde", "v5", "v7"] }
