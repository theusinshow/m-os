# Spike descartavel da Fase 1 do Meeting Agent. NAO e codigo de produto.
#
# `[workspace]` vazio declara este diretorio como raiz de workspace propria.
# Sem isso o cargo sobe a arvore, encontra o manifesto do M/OS e recusa com
# "believes it's in a workspace when it's not" — o mesmo problema que a raiz
# resolveu para o CronoCAD com `exclude`, resolvido aqui do lado de dentro
# para nao mexer no manifesto do produto por causa de um experimento.
[workspace]

[package]
name = "meeting-audio-spike"
version = "0.1.0"
description = "Disposable WASAPI capture spike for the M/OS Meeting Agent"
authors = ["Coded by M"]
edition = "2021"
publish = false

[[bin]]
name = "meeting-audio-spike"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
wasapi = "0.24"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
] }

[dev-dependencies]
tempfile = "3"
