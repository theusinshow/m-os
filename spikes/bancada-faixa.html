<!doctype html>
<!--
  Bancada da faixa de uso: o CSS REAL sobre um fundo claro.

  Existe por um motivo que so aparece tentando: a captura da janela do Tauri usa
  `PrintWindow`, que pinta o transparente de PRETO — e a calha da faixa tambem e
  preta. A silhueta dela (o raio dos cantos, a seta do popover saindo pela
  lateral) e invisivel na foto da janela real, e visivel aqui.

  A marcacao e escrita A MAO e pode divergir do que o React gera. Ela serve para
  ver FORMA e COR; quem responde por comportamento continua sendo a foto da
  janela de verdade. Ver a skill `ver-o-app`.

  Como usar:
      cd <raiz do repo> && python -m http.server 8899 --bind 127.0.0.1
      abra http://127.0.0.1:8899/spikes/bancada-faixa.html
-->
