[package]
name = "mos-storage-sqlite"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
mos-core = { path = "../mos-core" }
# O motor de sincronizacao. Este crate implementa as portas dele — quem guarda
# e o adaptador, e a regra fica no dominio.
mos-sync = { path = "../mos-sync" }
# O leitor dos transcripts. Este crate so guarda o que ele apura — o formato de
# arquivo de terceiro fica isolado la, e uma mudanca dele nao chega ao SQL.
mos-usage = { path = "../mos-usage" }
hex = "0.4"
rusqlite = { version = "0.40", features = ["backup", "bundled-full"] }
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
time.workspace = true
uuid.workspace = true
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
