[package]
name = "mos-hermes"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Ponte entre o M/OS e o Hermes existente"

# NAO acrescentar mos-storage-sqlite aqui.
#
# Hermes nao faz parte do Core (CORE-FOUNDATION.md:33) e nunca escreve no banco.
# A ausencia desta dependencia transforma essa regra em impossibilidade de
# compilacao, em vez de algo que alguem precisa lembrar de respeitar. Quando as
# acoes do M/OS chegarem, elas passam pela camada de aplicacao existente.
[dependencies]
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
# A feature de TLS e obrigatoria: sem ela, connect_async devolve
# TlsFeatureNotEnabled para qualquer wss://, e o erro chega ao usuario como
# falha generica de gateway. Gateway atras de proxy ou fora do loopback usa
# wss, e websocket_url ja mapeia https -> wss.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
# A feature de plataforma NAO e opcional. Sem ela o keyring 3 usa o keystore
# falso: set_password devolve Ok, o valor vive so na memoria daquele Entry, e a
# leitura seguinte nao acha nada. O sintoma era a credencial do Hermes ser
# "guardada com sucesso" e o app continuar dizendo que nao havia credencial.
keyring = { version = "3", features = ["windows-native"] }
